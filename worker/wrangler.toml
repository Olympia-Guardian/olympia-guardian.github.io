# Worker « ogs-room » : stockage durable des salons de synchro.
# Déploiement : npx wrangler deploy (depuis ce dossier).
name = "ogs-room"
main = "index.js"
compatibility_date = "2026-08-01"
workers_dev = true

# Journaux consultables (wrangler tail, tableau de bord Cloudflare) : sans ça,
# une panne en production ne laisse aucune trace exploitable.
[observability]
enabled = true

# Ménage nocturne : sessions expirées et compteurs de plus de trois mois.
# 3 h 27 UTC, à l'écart du cron de données de GitHub (4 h 17) pour ne pas
# empiler deux réveils sur la même minute.
[triggers]
crons = ["27 3 * * *"]

# Limite de débit par adresse IP. Le limiteur natif de Cloudflare est gratuit
# et ne consomme ni écriture D1 ni Durable Object, contrairement à un compteur
# maison. Deux budgets distincts : les routes qui sortent vers le Lodestone
# (site de Square Enix, à ménager) sont bien plus serrées que le reste.
[[unsafe.bindings]]
name = "RL_LODESTONE"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "RL_GENERAL"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 300, period = 60 }

[vars]
DISCORD_CLIENT_ID = "1537099783573995522"
APP_URL = "https://olympia-guardian.github.io"
# Compte super-admin : seul lui voit /admin/* et le tableau de bord.
ADMIN_USER_ID = "discord:161937296185229312"
GOOGLE_CLIENT_ID = "162870803068-es4ednvn0m4228kok51ffv9jbmb7bm6v.apps.googleusercontent.com"
# Les secrets ne sont jamais ici : ce depot est public. Ils se posent avec
# npx wrangler secret put <NOM> --config worker/wrangler.toml
# DISCORD_CLIENT_SECRET, GOOGLE_CLIENT_SECRET, XIVAUTH_CLIENT_SECRET, ADMIN_PIN

[[d1_databases]]
binding = "DB"
database_name = "ogs-rooms"
database_id = "e5cfba84-26c7-41a3-900e-e31d610ed25f"

# Temps réel : un salon WebSocket par utilisateur (cloche, coches, groupes).
[durable_objects]
bindings = [{ name = "LIVE", class_name = "LiveHub" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveHub"]
