# Rafraîchit chaque nuit les bases de données (public/data/) depuis FFXIV
# Collect, puis déclenche le redéploiement si quelque chose a changé.
name: Refresh data

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-data.mjs
      # La ronde FFXIV Collect tourne ICI et non dans le worker : leur
      # protection anti-bot bloque les requetes des Workers Cloudflare, pas
      # celles des runners GitHub. Elle ne fait pas echouer le rafraichissement
      # des catalogues : demain est un autre passage.
      - run: node scripts/collect-sync.mjs
        continue-on-error: true
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      - name: Commit & push si changement
        id: commit
        run: |
          git config user.name "Olympia Guardian"
          git config user.email "olympia-guardian@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Data : rafraichissement quotidien des bases FFXIV Collect"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Les pushes faits avec GITHUB_TOKEN ne déclenchent pas les workflows
      # on:push → on lance le déploiement explicitement.
      - name: Déclencher le déploiement
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY"
